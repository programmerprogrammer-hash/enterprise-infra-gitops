apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-app
  namespace: production
  labels:
    app: enterprise-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-app
  template:
    metadata:
      labels:
        app: enterprise-app
    spec:
      containers:
      - name: enterprise-app
        # WICHTIG: Die Pipeline sucht nach "image: ghcr.io/" und ersetzt diese Zeile!
        image: ghcr.io/dein-github-username/enterprise-app-repo:placeholder
        ports:
        - containerPort: 8080
        # DevSecOps-Standard: Strengste Container-Härtung im Cluster
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
